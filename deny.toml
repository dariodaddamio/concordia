# cargo-deny configuration (run: cargo deny check)
# Schema for cargo-deny >= 0.16. Security advisories (vulnerabilities) are always denied.

[graph]
# concordia is a Windows-first binary; check the dependency graph that actually ships there.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Check transitive dependencies too: they are part of the shipped application.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licenses only. Anything else fails the build until reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.8
# The allow-list is deliberately broader than today's tree; do not warn about unused entries.
unused-allowed-license = "allow"

# option-ext (via dirs -> dirs-sys) is MPL-2.0: file-level copyleft. Using it unmodified as a
# dependency of an MIT binary is fine, but it is a conscious exception, not a blanket allowance.
# If it is ever vendored or modified, those files must stay under MPL-2.0 and be published.
exceptions = [
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # Unmodified file-copyleft dependencies of the native Mermaid parser's HTML-label support.
  # These are scoped exceptions; MPL is not added to the global license allow-list.
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
