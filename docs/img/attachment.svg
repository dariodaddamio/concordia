<text x="23" y="69" textLength="189" lengthAdjust="spacingAndGlyphs" fill="#ffb000">Credits: 12.5 balance</text>
<text x="230" y="69" textLength="378" lengthAdjust="spacingAndGlyphs" fill="#9e9a92">│  Subscription: 5h 59% left · 7d 41% left</text>
