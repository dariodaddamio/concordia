<text x="41" y="107" textLength="126" lengthAdjust="spacingAndGlyphs" fill="#ffb000" font-weight="700">What I changed</text>
<text x="986" y="107" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="986" y="126" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="41" y="145" textLength="81" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">I added a</text>
<text x="131" y="145" textLength="135" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0" font-weight="700">duplicate check</text>
<text x="275" y="145" textLength="18" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">to</text>
<text x="302" y="145" textLength="54" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">doctor</text>
<text x="356" y="145" textLength="621" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">. It groups accounts by provider and email, so two slots signed in to</text>
<text x="986" y="145" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="41" y="164" textLength="297" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">the same login are reported once.</text>
<text x="986" y="164" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="986" y="183" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="41" y="202" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">•</text>
<text x="59" y="202" textLength="234" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">accounts::duplicate_groups</text>
<text x="302" y="202" textLength="144" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">finds the groups</text>
<text x="986" y="202" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="41" y="221" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">•</text>
<text x="59" y="221" textLength="54" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">doctor</text>
<text x="122" y="221" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">prints a warning per group, naming both accounts and the fix</text>
<text x="986" y="221" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="41" y="240" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">•</text>
<text x="59" y="240" textLength="27" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">the</text>
<text x="95" y="240" textLength="36" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">/use</text>
<text x="140" y="240" textLength="243" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">picker marks each side with</text>
<text x="392" y="240" textLength="153" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0" font-style="italic">same login as ...</text>
<text x="986" y="240" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="986" y="259" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="59" y="278" textLength="36" lengthAdjust="spacingAndGlyphs" fill="#868177" font-style="italic">rust</text>
<text x="986" y="278" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="59" y="297" textLength="333" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">for group in duplicate_groups(root) {</text>
<text x="986" y="297" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="95" y="316" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">warn(&amp;group);</text>
<text x="986" y="316" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="59" y="335" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">}</text>
<text x="986" y="335" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#ffb000">┃</text>
<text x="986" y="354" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#7c7c7c">│</text>
<text x="41" y="373" textLength="18" lengthAdjust="spacingAndGlyphs" fill="#ffb000">1.</text>
<text x="68" y="373" textLength="27" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">Run</text>
<text x="104" y="373" textLength="63" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">/doctor</text>
<text x="176" y="373" textLength="81" lengthAdjust="spacingAndGlyphs" fill="#d8d0c0">to see it</text>
<text x="986" y="373" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#7c7c7c">│</text>
<text x="41" y="392" textLength="18" lengthAdjust="spacingAndGlyphs" fill="#ffb000">2.</text>
