<text x="41" y="240" textLength="576" lengthAdjust="spacingAndGlyphs" fill="#808080" font-style="italic">Checking how the region filter treats a null before it compares.</text>
<text x="41" y="259" textLength="756" lengthAdjust="spacingAndGlyphs" fill="#808080" font-style="italic">The comparison runs first, so a missing region never matches and the row is dropped.</text>
<text x="41" y="278" textLength="531" lengthAdjust="spacingAndGlyphs" fill="#808080" font-style="italic">Running the filter tests to confirm before proposing a fix.</text>
