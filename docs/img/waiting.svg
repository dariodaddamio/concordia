<text x="23" y="126" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#0dbc79" font-weight="700">&gt;</text>
<text x="41" y="126" textLength="495" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4" font-weight="700">Why does the nightly sync skip rows with a null region?</text>
<text x="23" y="145" textLength="207" lengthAdjust="spacingAndGlyphs" fill="#87d787" font-weight="700">Codex 3 · gpt-5.1-codex</text>
<text x="23" y="164" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">▸</text>
<text x="41" y="164" textLength="288" lengthAdjust="spacingAndGlyphs" fill="#87af87">│ ✓ shell  rg -n region src/sync</text>
<text x="23" y="183" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">▸</text>
<text x="41" y="183" textLength="72" lengthAdjust="spacingAndGlyphs" fill="#87af87">│ ✓ read</text>
<text x="131" y="183" textLength="162" lengthAdjust="spacingAndGlyphs" fill="#87af87" text-decoration="underline">src/sync/filter.rs</text>
<text x="23" y="202" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">▸</text>
<text x="41" y="202" textLength="306" lengthAdjust="spacingAndGlyphs" fill="#11a8cd">│ ◉ shell  cargo test sync::filter</text>
<text x="23" y="221" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#bc3fbc">~</text>
<text x="41" y="221" textLength="576" lengthAdjust="spacingAndGlyphs" fill="#808080" font-style="italic">Checking how the region filter treats a null before it compares.</text>
<text x="41" y="240" textLength="756" lengthAdjust="spacingAndGlyphs" fill="#808080" font-style="italic">The comparison runs first, so a missing region never matches and the row is dropped.</text>
<text x="41" y="259" textLength="531" lengthAdjust="spacingAndGlyphs" fill="#808080" font-style="italic">Running the filter tests to confirm before proposing a fix.</text>
