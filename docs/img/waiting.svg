<text x="23" y="145" textLength="45" lengthAdjust="spacingAndGlyphs" fill="#87d7ff" font-weight="700">You ›</text>
<text x="77" y="145" textLength="495" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">Why does the nightly sync skip rows with a null region?</text>
<text x="23" y="164" textLength="207" lengthAdjust="spacingAndGlyphs" fill="#87d787" font-weight="700">Codex 3 · gpt-5.1-codex</text>
<text x="23" y="183" textLength="360" lengthAdjust="spacingAndGlyphs" fill="#87af87">▸ │ ✓ Run command  rg -n region src/sync</text>
<text x="23" y="202" textLength="315" lengthAdjust="spacingAndGlyphs" fill="#87af87">▸ │ ✓ Read file  src/sync/filter.rs</text>
