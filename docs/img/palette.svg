<text x="23" y="50" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#5fafff" font-weight="700">◆</text>
<text x="41" y="50" textLength="81" lengthAdjust="spacingAndGlyphs" fill="#d0d0d0" font-weight="700">concordia</text>
<text x="131" y="50" textLength="99" lengthAdjust="spacingAndGlyphs" fill="#666666">2026-10-21d</text>
<text x="266" y="50" textLength="63" lengthAdjust="spacingAndGlyphs" fill="#000000" font-weight="700">Codex 3</text>
<text x="356" y="50" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#e5e5e5">gpt-5.1-codex</text>
<text x="770" y="50" textLength="225" lengthAdjust="spacingAndGlyphs" fill="#666666">5h 59% left · 7d 41% left</text>
<text x="23" y="69" textLength="27" lengthAdjust="spacingAndGlyphs" fill="#5fafff">| i</text>
<text x="59" y="69" textLength="837" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">Type a message and press Enter. Start with / for commands. Drag to select; Ctrl+C copies; Esc</text>
<text x="23" y="88" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#5fafff">|</text>
<text x="59" y="88" textLength="99" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">interrupts.</text>
<text x="23" y="126" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#0dbc79" font-weight="700">&gt;</text>
<text x="41" y="126" textLength="567" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4" font-weight="700">Add a /doctor check for duplicate accounts and show me the diff</text>
<text x="23" y="145" textLength="279" lengthAdjust="spacingAndGlyphs" fill="#87d787" font-weight="700">Codex · codex-3 · gpt-5.1-codex</text>
<text x="23" y="164" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">▸</text>
<text x="41" y="164" textLength="270" lengthAdjust="spacingAndGlyphs" fill="#87af87">│ ✓ shell  rg -n duplicate src</text>
<text x="23" y="183" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">▸</text>
<text x="41" y="183" textLength="72" lengthAdjust="spacingAndGlyphs" fill="#87af87">│ ✓ edit</text>
<text x="131" y="183" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#87af87" text-decoration="underline">src/doctor.rs</text>
<text x="23" y="202" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">▸</text>
<text x="41" y="202" textLength="306" lengthAdjust="spacingAndGlyphs" fill="#11a8cd">│ ◉ shell  cargo test -p concordia</text>
<text x="23" y="221" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d7af5f">●</text>
<text x="41" y="221" textLength="126" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">What I changed</text>
<text x="41" y="259" textLength="81" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">I added a</text>
<text x="131" y="259" textLength="135" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4" font-weight="700">duplicate check</text>
<text x="275" y="259" textLength="18" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">to</text>
<text x="302" y="259" textLength="54" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">doctor</text>
<text x="356" y="259" textLength="621" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">. It groups accounts by provider and email, so two slots signed in to</text>
<text x="41" y="278" textLength="297" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">the same login are reported once.</text>
<text x="41" y="316" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#11a8cd">•</text>
<text x="59" y="316" textLength="234" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">accounts::duplicate_groups</text>
<text x="302" y="316" textLength="144" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">finds the groups</text>
<text x="41" y="335" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#11a8cd">•</text>
<text x="59" y="335" textLength="54" lengthAdjust="spacingAndGlyphs" fill="#ffd7af">doctor</text>
<text x="122" y="335" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4">prints a warning per group, naming both accounts and the fix</text>
<text x="23" y="354" textLength="738" lengthAdjust="spacingAndGlyphs" fill="#666666">╭ commands · 43 ─────────────────────────────────────────────────────────────────╮</text>
<text x="23" y="373" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="32" y="373" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#d4d4d4" font-weight="700">&gt;</text>
<text x="50" y="373" textLength="36" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/use</text>
<text x="275" y="373" textLength="234" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a" font-weight="700">switch account or provider</text>
<text x="752" y="373" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="392" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="392" textLength="72" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/use add</text>
<text x="275" y="392" textLength="189" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">connect a new account</text>
<text x="752" y="392" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="411" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="411" textLength="99" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/use remove</text>
<text x="275" y="411" textLength="153" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">remove an account</text>
<text x="752" y="411" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="430" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="430" textLength="45" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/mode</text>
<text x="275" y="430" textLength="360" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">permission mode: plan, ask, auto or full</text>
<text x="752" y="430" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="449" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="449" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/continuation</text>
<text x="275" y="449" textLength="306" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">usage handoff: manual or automatic</text>
<text x="752" y="449" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="468" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="468" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/continuation manual</text>
<text x="275" y="468" textLength="198" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">pause at a usage limit</text>
<text x="752" y="468" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="487" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="487" textLength="207" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/continuation automatic</text>
<text x="275" y="487" textLength="477" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">continue through configured accounts at a usage limit</text>
<text x="752" y="487" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="506" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="506" textLength="81" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/continue</text>
<text x="275" y="506" textLength="459" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">continue a usage-limited request: /continue ACCOUNT</text>
<text x="752" y="506" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="525" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
