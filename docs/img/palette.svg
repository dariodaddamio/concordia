<text x="509" y="22" font-family="Cascadia Mono, Consolas, monospace" font-size="12" fill="#8b909c" text-anchor="middle">concordia — command options</text>
<rect x="14" y="36" width="225" height="19" fill="#303030"/>
<rect x="239" y="36" width="81" height="19" fill="#87d787"/>
<rect x="320" y="36" width="684" height="19" fill="#303030"/>
<rect x="14" y="55" width="990" height="19" fill="#303030"/>
