<text x="275" y="525" textLength="144" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">choose the model</text>
<text x="752" y="525" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="544" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="50" y="544" textLength="54" lengthAdjust="spacingAndGlyphs" fill="#11a8cd" font-weight="700">/usage</text>
<text x="275" y="544" textLength="207" lengthAdjust="spacingAndGlyphs" fill="#8a8a8a">limits for this account</text>
<text x="752" y="544" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#666666">│</text>
<text x="23" y="563" textLength="738" lengthAdjust="spacingAndGlyphs" fill="#666666">╰────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="14" y="582" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#585858">╭</text>
<text x="32" y="582" textLength="63" lengthAdjust="spacingAndGlyphs" fill="#666666">message</text>
<text x="104" y="582" textLength="900" lengthAdjust="spacingAndGlyphs" fill="#585858">───────────────────────────────────────────────────────────────────────────────────────────────────╮</text>
<text x="14" y="601" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#585858">│</text>
