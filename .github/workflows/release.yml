name: release

# Tag vX.Y.Z (matching crates/concordia/Cargo.toml) to publish. workflow_dispatch builds and
# verifies everything but does not publish, so the pipeline can be rehearsed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $toml = Get-Content crates/concordia/Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "no version in Cargo.toml" }
          $want = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $want" }

      # The same gates as CI: a tag must never ship something CI would have rejected.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p concordia --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p concordia --tests --locked --no-fail-fast

      - name: Test (slow PTY journeys)
        run: cargo test -p concordia --test tui_journeys --locked --no-fail-fast -- --ignored

      - name: Build release
        run: cargo build -p concordia --release --locked

      - name: Smoke the exact artifact
        shell: pwsh
        run: ./scripts/smoke-ci.ps1

      - name: Third-party licenses
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Generate THIRD-PARTY-LICENSES
        shell: pwsh
        run: cargo about generate about.hbs --output-file THIRD-PARTY-LICENSES.txt

      - name: Stage assets
        shell: pwsh
        run: |
          function Get-Sha256([string]$Path) {
            $fs = [IO.File]::OpenRead((Resolve-Path $Path).Path)
            try {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { return ([BitConverter]::ToString($sha.ComputeHash($fs)) -replace '-', '').ToLower() }
              finally { $sha.Dispose() }
            } finally { $fs.Dispose() }
          }
          $name = "concordia-x86_64-pc-windows-msvc.exe"
          # Only concordia.exe ships. target\release also holds the test-only concordia-fake-provider.
          Copy-Item target\release\concordia.exe $name
          # The zip is what install.ps1, cargo binstall, scoop and winget consume. Its single
          # exe is at the root so `bin-dir = "concordia.exe"` and nested-installer paths work.
          $zipName = "concordia-x86_64-pc-windows-msvc.zip"
          $stage = Join-Path $env:RUNNER_TEMP "zip-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\concordia.exe (Join-Path $stage "concordia.exe")
          Copy-Item LICENSE $stage
          Copy-Item THIRD-PARTY-LICENSES.txt $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zipName -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipName).Path)
          try { $names = @($entries.Entries | ForEach-Object { $_.FullName }) } finally { $entries.Dispose() }
          if ($names -notcontains "concordia.exe") { throw "zip has no concordia.exe at its root: $($names -join ', ')" }
          $exeHash = Get-Sha256 $name
          $zipHash = Get-Sha256 $zipName
          # SHA256SUMS keeps its name and the exe line: the in-app updater (release.rs) reads it.
          Set-Content -Path SHA256SUMS -Value @("$exeHash  $name", "$zipHash  $zipName") -Encoding ascii
          # Per-asset checksum file that install.ps1 downloads next to the zip.
          Set-Content -Path "$zipName.sha256" -Value "$zipHash  $zipName" -Encoding ascii
          Get-Content SHA256SUMS
          Get-Content "$zipName.sha256"

      - name: Render package manifests
        shell: pwsh
        run: |
          # Runs on tags and rehearsals alike, so a broken template fails the rehearsal.
          # Tokens: OWNER/concordia (repo), OWNER (owner part), REPLACE_VERSION, REPLACE_SHA256.
          $toml = Get-Content crates/concordia/Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "no version in Cargo.toml" }
          $ver = $Matches[1]
          $zipHash = ((Get-Content "concordia-x86_64-pc-windows-msvc.zip.sha256" -Raw).Trim() -split '\s+')[0]
          if ($zipHash -notmatch '^[0-9a-f]{64}$') { throw "bad zip hash: $zipHash" }
          $repo = $env:GITHUB_REPOSITORY
          $owner = $repo.Split('/')[0]
          $out = Join-Path $env:RUNNER_TEMP "dist-packaging"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $files = @(Get-ChildItem packaging -Recurse -File -Include *.json, *.yaml | Where-Object { $_.FullName -notmatch '\\packaging\\README' })
          foreach ($f in $files) {
            $text = Get-Content $f.FullName -Raw
            $text = $text.Replace("OWNER/concordia", $repo).Replace("OWNER", $owner)
            $text = $text.Replace("REPLACE_VERSION", $ver).Replace("REPLACE_SHA256", $zipHash)
            # Case-sensitive: an owner name such as "exampleowner" must not trip the OWNER check.
            if ($text -cmatch 'REPLACE_|OWNER') { throw "unrendered token in $($f.Name)" }
            if ($f.Extension -eq ".json") { $null = $text | ConvertFrom-Json }
            $dest = if ($f.Directory.Name -eq "scoop") { "concordia.json" } else { $f.Name.Replace("OWNER", $owner) }
            Set-Content -Path (Join-Path $out $dest) -Value $text -Encoding ascii
          }
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            concordia-x86_64-pc-windows-msvc.exe
            concordia-x86_64-pc-windows-msvc.zip
            concordia-x86_64-pc-windows-msvc.zip.sha256
            SHA256SUMS
            THIRD-PARTY-LICENSES.txt
            LICENSE
            ${{ runner.temp }}/dist-packaging/*
          # 0.x and any -suffix tag are pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the rehearsal artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: concordia-rehearsal
          path: |
            concordia-x86_64-pc-windows-msvc.exe
            concordia-x86_64-pc-windows-msvc.zip
            concordia-x86_64-pc-windows-msvc.zip.sha256
            SHA256SUMS
            THIRD-PARTY-LICENSES.txt
            ${{ runner.temp }}/dist-packaging/
