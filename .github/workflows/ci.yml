name: ci

# Automatic runs are paused while the GitHub Actions allowance is exhausted.
# Existing checks remain available through an explicit manual run.
on:
  workflow_dispatch:

# A newer manual run of the same ref supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    runs-on: windows-latest
    # Cold native codec builds plus source-update and ConPTY fixtures need a bounded larger window.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check hidden child-process constructors
        shell: pwsh
        run: ./scripts/check-hidden-process-spawns.ps1

      # rust-toolchain.toml pins the compiler (and clippy/rustfmt) so lints cannot drift.
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy -p concordia --all-targets --locked -- -D warnings

      # Unit, TUI end-to-end, CLI, and fake-provider tests. No provider CLI or network needed.
      - name: Test
        run: cargo test -p concordia --tests --locked --no-fail-fast

      - name: Test (slow PTY journeys)
        run: cargo test -p concordia --test tui_journeys --locked --no-fail-fast -- --ignored

      - name: Build release
        run: cargo build -p concordia --release --locked

      - name: Smoke the release binary
        shell: pwsh
        run: ./scripts/smoke-ci.ps1

      - name: OSS gates
        shell: pwsh
        run: ./scripts/verify-oss-gates.ps1

  # Licenses, advisories, banned/duplicate crates, and registry sources (see deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
