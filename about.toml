# cargo-about: generates THIRD-PARTY-LICENSES.txt (run: cargo about generate about.hbs)
# Binary redistribution of MIT/Apache/BSD crates requires shipping their notices; this produces them.
# Keep `accepted` in step with deny.toml.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
# The dev-only fake provider and test crates are not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = false
