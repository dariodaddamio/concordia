[package]
name = "concordia"
version = "0.0.1"
edition = "2021"
description = "Local provider orchestration TUI"
license = "MIT"
publish = false

[[bin]]
name = "concordia"
path = "src/main.rs"

# Test support only: stands in for codex/claude/agent in integration tests. Never installed or
# released (the install script and release workflow copy concordia.exe alone).
[[bin]]
name = "concordia-fake-provider"
path = "tests/support/fake_provider.rs"
test = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
unicode-width = "0.2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
