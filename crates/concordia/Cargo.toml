[package]
name = "concordia"
version = "0.0.1"
edition = "2021"
description = "Local provider orchestration TUI"
license = "MIT"
publish = false

[[bin]]
name = "concordia"
path = "src/main.rs"

# `cargo binstall concordia` downloads the release zip (see .github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "https://github.com/dariodaddamio/concordia/releases/download/v{ version }/concordia-{ target }.zip"
bin-dir = "concordia.exe"
pkg-fmt = "zip"

# Test support only: stands in for codex/claude/agent in integration tests. Never installed or
# released (the install script and release workflow copy concordia.exe alone).
[[bin]]
name = "concordia-fake-provider"
path = "tests/support/fake_provider.rs"
test = false

# Test support only: verifies that provider children die when Concordia exits abruptly.
[[bin]]
name = "concordia-lifetime-probe"
path = "tests/support/lifetime_probe.rs"
test = false

# Test support only: stands in for a user's harness adapter in integration tests. Never installed.
[[bin]]
name = "concordia-fake-harness"
path = "tests/support/fake_harness.rs"
test = false

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
crossterm = "0.29"
dirs = "6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
ignore = "0.4"
mermansi = "=0.1.6"
sha2 = "0.10"
unicode-width = "0.2.3"
# Only embedded grammars/themes are used; never load external YAML/plist grammars or themes.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
