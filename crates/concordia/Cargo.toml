[package]
name = "concordia"
version = "0.0.1"
edition = "2021"
description = "Local provider orchestration TUI"
license = "MIT"
publish = false

[[bin]]
name = "concordia"
path = "src/main.rs"

# `cargo binstall concordia` downloads the release zip (see .github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "https://github.com/dariodaddamio/concordia/releases/download/v{ version }/concordia-{ target }.zip"
bin-dir = "concordia.exe"
pkg-fmt = "zip"

# Test support only: stands in for codex/claude/agent in integration tests. Never installed or
# released (the install script and release workflow copy concordia.exe alone).
[[bin]]
name = "concordia-fake-provider"
path = "tests/support/fake_provider.rs"
test = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
unicode-width = "0.2"
portable-pty = "0.9"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
